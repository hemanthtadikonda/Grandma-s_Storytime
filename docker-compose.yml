services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Local dev only — omit profile on EC2 when using AWS S3 + IAM role (see .env.aws.example)
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./schemas:/app/schemas:ro
      - ./templates:/app/templates:ro

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./schemas:/app/schemas:ro
      - ./templates:/app/templates:ro

  # Optional local LLM — enable: docker compose --profile llm up -d ollama worker api
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  minio_data:
  ollama_data:
